# Helix repo-level config — copy to <repo>/.helix/config.toml
# Helix loads ./.helix/config.toml as workspace config (since 24.07).
# Override anything you set in ~/.config/helix/config.toml.
# See: https://docs.helix-editor.com/configuration.html

theme = "catppuccin_mocha"

[editor]
line-number = "relative"
cursorline = true
cursorcolumn = false
color-modes = true
true-color = true
rulers = [79, 80]
bufferline = "multiple"
idle-timeout = 100
mouse = true
auto-save = false
# keep consistent with .editorconfig (tabs, 2-width display)
[editor.indent-guides]
render = true
character = "┊"
skip-levels = 1

[editor.whitespace.render]
space = "none"
tab = "all"
newline = "none"

[editor.whitespace.characters]
tab = "→"
newline = "↴"

[editor.statusline]
left = ["mode", "spinner", "file-name", "read-only-indicator", "file-modification-indicator"]
center = ["diagnostics", "workspace-diagnostics"]
right = ["selections", "position", "position-percentage", "file-encoding"]
separator = "│"
mode.normal = "NORMAL"
mode.insert = "INSERT"
mode.select = "SELECT"

[editor.cursor-shape]
normal = "block"
insert = "bar"
select = "underline"

[editor.file-picker]
hidden = false
git-ignore = true

[editor.lsp]
enable = true
display-messages = true
display-inlay-hints = true
auto-signature-help = true

# Keys — keep minimal; put personal binds in ~/.config/helix/config.toml
[keys.normal]
# Example: "C-s" = ":w"
# "C-q" = ":q"

[keys.insert]
# "C-c" = "normal_mode"
