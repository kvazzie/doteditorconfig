# Helix repo-level languages — copy to <repo>/.helix/languages.toml
# Only override what the repo actually uses; Helix merges with ~/.config/helix/languages.toml
# Docs: https://docs.helix-editor.com/languages.html
#
# --- Nix (same tools as devenv.nix / CI: nixpkgs-fmt + nixd) ---
# devenv `languages.nix.enable` provides nixd as the language server;
# `nixpkgs-fmt` is the formatter enforced by the git-hooks/CI check.
[[language]]
name = "nix"
auto-format = true
formatter = { command = "nixpkgs-fmt" }
language-servers = ["nixd"]
indent = { tab-width = 2, unit = "  " }

[language-server.nixd]
command = "nixd"

# --- Markdown (respects .editorconfig max_line_length = off) ---
[[language]]
name = "markdown"
auto-format = false
soft-wrap.enable = true
soft-wrap.wrap-indicator = ""

# --- Bash / Shell (if shellcheck/shfmt enabled in devenv.nix) ---
[[language]]
name = "bash"
auto-format = true
formatter = { command = "shfmt", args = ["-i", "2", "-ci"] }
language-servers = ["bash-language-server"]

[language-server.bash-language-server]
command = "bash-language-server"
args = ["start"]

